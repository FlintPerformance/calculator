<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#060606">
  <title>Flint Performance | Fitness Calculators</title>
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="stylesheet" href="css/styles.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@900&family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
</head>
<body>
  <a href="#main-content" class="skip-link">Skip to content</a>
  <div id="app">

    <!-- Top Bar -->
    <header class="top-bar">
      <span class="top-bar-logo">FLINT<span class="logo-dot">.</span></span>
      <span class="top-bar-title" id="active-calc-title">BMI</span>
    </header>

    <!-- Screens -->
    <main class="screens" id="main-content">

      <!-- BMI -->
      <section class="screen active" id="calc-bmi">
        <div class="screen-scroll">
          <div class="screen-hero">
            <h2 class="screen-title">BMI</h2>
            <p class="screen-subtitle">Body Mass Index</p>
          </div>
          <div class="screen-form">
            <div class="unit-toggle">
              <button class="unit-btn active" data-unit="imperial">Imperial</button>
              <button class="unit-btn" data-unit="metric">Metric</button>
            </div>
            <div class="field imperial-fields">
              <label>Height</label>
              <div class="field-row">
                <div class="field-input">
                  <input type="number" id="bmi-feet" data-sync="feet" placeholder="5" min="1" max="8">
                  <span class="field-unit">ft</span>
                </div>
                <div class="field-input">
                  <input type="number" id="bmi-inches" data-sync="inches" placeholder="10" min="0" max="11">
                  <span class="field-unit">in</span>
                </div>
              </div>
            </div>
            <div class="field metric-fields" style="display:none;">
              <label>Height</label>
              <div class="field-input">
                <input type="number" id="bmi-cm" data-sync="cm" placeholder="178" min="50" max="250">
                <span class="field-unit">cm</span>
              </div>
            </div>
            <div class="field">
              <label>Weight</label>
              <div class="field-input">
                <input type="number" id="bmi-weight" data-sync="weight" placeholder="180" min="1">
                <span class="field-unit dynamic-weight-unit">lbs</span>
              </div>
            </div>
            <button class="action-btn" onclick="calculateBMI()">Calculate</button>
          </div>
          <div class="screen-result" id="bmi-result"></div>
        </div>
      </section>

      <!-- FFMI -->
      <section class="screen" id="calc-ffmi">
        <div class="screen-scroll">
          <div class="screen-hero">
            <h2 class="screen-title">FFMI</h2>
            <p class="screen-subtitle">Fat-Free Mass Index</p>
          </div>
          <div class="screen-form">
            <div class="unit-toggle">
              <button class="unit-btn active" data-unit="imperial">Imperial</button>
              <button class="unit-btn" data-unit="metric">Metric</button>
            </div>
            <div class="field imperial-fields">
              <label>Height</label>
              <div class="field-row">
                <div class="field-input">
                  <input type="number" id="ffmi-feet" data-sync="feet" placeholder="5" min="1" max="8">
                  <span class="field-unit">ft</span>
                </div>
                <div class="field-input">
                  <input type="number" id="ffmi-inches" data-sync="inches" placeholder="10" min="0" max="11">
                  <span class="field-unit">in</span>
                </div>
              </div>
            </div>
            <div class="field metric-fields" style="display:none;">
              <label>Height</label>
              <div class="field-input">
                <input type="number" id="ffmi-cm" data-sync="cm" placeholder="178" min="50" max="250">
                <span class="field-unit">cm</span>
              </div>
            </div>
            <div class="field">
              <label>Weight</label>
              <div class="field-input">
                <input type="number" id="ffmi-weight" data-sync="weight" placeholder="180" min="1">
                <span class="field-unit dynamic-weight-unit">lbs</span>
              </div>
            </div>
            <div class="field">
              <label>Body Fat %</label>
              <div class="field-input">
                <input type="number" id="ffmi-bf" placeholder="15" min="1" max="60">
                <span class="field-unit">%</span>
              </div>
            </div>
            <button class="action-btn" onclick="calculateFFMI()">Calculate</button>
          </div>
          <div class="screen-result" id="ffmi-result"></div>
        </div>
      </section>

      <!-- TDEE -->
      <section class="screen" id="calc-tdee">
        <div class="screen-scroll">
          <div class="screen-hero">
            <h2 class="screen-title">TDEE</h2>
            <p class="screen-subtitle">Total Daily Energy Expenditure</p>
          </div>
          <div class="screen-form">
            <div class="unit-toggle">
              <button class="unit-btn active" data-unit="imperial">Imperial</button>
              <button class="unit-btn" data-unit="metric">Metric</button>
            </div>
            <div class="field-row">
              <div class="field">
                <label>Sex</label>
                <select id="tdee-sex" data-sync="sex">
                  <option value="male">Male</option>
                  <option value="female">Female</option>
                </select>
              </div>
              <div class="field">
                <label>Age</label>
                <div class="field-input">
                  <input type="number" id="tdee-age" data-sync="age" placeholder="25" min="10" max="100">
                  <span class="field-unit">yrs</span>
                </div>
              </div>
            </div>
            <div class="field imperial-fields">
              <label>Height</label>
              <div class="field-row">
                <div class="field-input">
                  <input type="number" id="tdee-feet" data-sync="feet" placeholder="5" min="1" max="8">
                  <span class="field-unit">ft</span>
                </div>
                <div class="field-input">
                  <input type="number" id="tdee-inches" data-sync="inches" placeholder="10" min="0" max="11">
                  <span class="field-unit">in</span>
                </div>
              </div>
            </div>
            <div class="field metric-fields" style="display:none;">
              <label>Height</label>
              <div class="field-input">
                <input type="number" id="tdee-cm" data-sync="cm" placeholder="178" min="50" max="250">
                <span class="field-unit">cm</span>
              </div>
            </div>
            <div class="field">
              <label>Weight</label>
              <div class="field-input">
                <input type="number" id="tdee-weight" data-sync="weight" placeholder="180" min="1">
                <span class="field-unit dynamic-weight-unit">lbs</span>
              </div>
            </div>
            <div class="field">
              <label>Activity Level</label>
              <select id="tdee-activity">
                <option value="1.2">Sedentary (office job)</option>
                <option value="1.375">Lightly Active (1-3 days/wk)</option>
                <option value="1.55" selected>Moderately Active (3-5 days/wk)</option>
                <option value="1.725">Very Active (6-7 days/wk)</option>
                <option value="1.9">Extremely Active (athlete)</option>
              </select>
            </div>
            <div class="field">
              <label>Macro Ratio</label>
              <select id="tdee-macro-ratio">
                <option value="balanced">Balanced (40/30/30 — C/P/F)</option>
                <option value="high-protein">High Protein (35/40/25 — C/P/F)</option>
                <option value="low-carb">Low Carb (20/40/40 — C/P/F)</option>
                <option value="low-fat">Low Fat (50/30/20 — C/P/F)</option>
                <option value="keto">Keto (5/30/65 — C/P/F)</option>
                <option value="zone">Zone Diet (40/30/30 — C/P/F)</option>
              </select>
            </div>
            <button class="action-btn" onclick="calculateTDEE()">Calculate</button>
          </div>
          <div class="screen-result" id="tdee-result"></div>
        </div>
      </section>

      <!-- 1RM -->
      <section class="screen" id="calc-one-rep-max">
        <div class="screen-scroll">
          <div class="screen-hero">
            <h2 class="screen-title">1RM</h2>
            <p class="screen-subtitle">One Rep Max Estimator</p>
          </div>
          <div class="screen-form">
            <div class="field">
              <label>Weight Lifted</label>
              <div class="field-input">
                <input type="number" id="orm-weight" placeholder="225" min="1">
                <span class="field-unit">lbs</span>
              </div>
            </div>
            <div class="field">
              <label>Reps Performed</label>
              <div class="field-input">
                <input type="number" id="orm-reps" placeholder="5" min="1" max="30">
                <span class="field-unit">reps</span>
              </div>
            </div>
            <button class="action-btn" onclick="calculateOneRepMax()">Calculate</button>
          </div>
          <div class="screen-result" id="orm-result"></div>
        </div>
      </section>

      <!-- Wilks -->
      <section class="screen" id="calc-wilks">
        <div class="screen-scroll">
          <div class="screen-hero">
            <h2 class="screen-title">WILKS</h2>
            <p class="screen-subtitle">Strength Coefficient</p>
          </div>
          <div class="screen-form">
            <div class="field">
              <label>Sex</label>
              <select id="wilks-sex" data-sync="sex">
                <option value="male">Male</option>
                <option value="female">Female</option>
              </select>
            </div>
            <div class="field">
              <label>Body Weight</label>
              <div class="field-input">
                <input type="number" id="wilks-bw" data-sync="weight" placeholder="180" min="1">
                <span class="field-unit">lbs</span>
              </div>
            </div>
            <div class="field">
              <label>Total (S + B + D)</label>
              <div class="field-input">
                <input type="number" id="wilks-total" placeholder="1000" min="1">
                <span class="field-unit">lbs</span>
              </div>
            </div>
            <button class="action-btn" onclick="calculateWilks()">Calculate</button>
          </div>
          <div class="screen-result" id="wilks-result"></div>
        </div>
      </section>

    </main>

    <!-- Bottom Tab Bar -->
    <nav class="tab-bar">
      <button class="tab active" data-calc="bmi">
        <svg class="tab-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M12 2a4 4 0 1 1 0 8 4 4 0 0 1 0-8z"/><path d="M6 22v-4a6 6 0 0 1 12 0v4"/></svg>
        <span>BMI</span>
      </button>
      <button class="tab" data-calc="ffmi">
        <svg class="tab-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M6.5 6.5L4 4m0 0l2.5 2.5M4 4l2.5-2.5M4 4L1.5 6.5"/><path d="M17.5 6.5L20 4m0 0l-2.5 2.5M20 4l-2.5-2.5M20 4l2.5 2.5"/><rect x="8" y="8" width="8" height="14" rx="1"/><line x1="12" y1="8" x2="12" y2="22"/></svg>
        <span>FFMI</span>
      </button>
      <button class="tab" data-calc="tdee">
        <svg class="tab-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2z"/><path d="M12 6v6l4.5 2.5"/></svg>
        <span>TDEE</span>
      </button>
      <button class="tab" data-calc="one-rep-max">
        <svg class="tab-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="1" y="9" width="4" height="6" rx="1"/><rect x="19" y="9" width="4" height="6" rx="1"/><line x1="5" y1="12" x2="19" y2="12"/><rect x="7" y="7" width="3" height="10" rx="0.5"/><rect x="14" y="7" width="3" height="10" rx="0.5"/></svg>
        <span>1RM</span>
      </button>
      <button class="tab" data-calc="wilks">
        <svg class="tab-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M8 21l4-12 4 12"/><path d="M6 17h12"/><path d="M12 3v6"/><circle cx="12" cy="3" r="1.5"/></svg>
        <span>Wilks</span>
      </button>
    </nav>

  </div>

  <script src="js/calculators.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
