<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#060606">

  <!-- SEO -->
  <title>Fitness Calculators | Flint Performance — BMI, FFMI, TDEE, 1RM, Wilks</title>
  <meta name="description" content="Free fitness calculators from Flint Performance. Calculate BMI, FFMI, TDEE with macro breakdowns, one rep max estimates, and Wilks powerlifting scores. Data syncs between calculators.">
  <meta name="keywords" content="fitness calculator, BMI calculator, FFMI calculator, TDEE calculator, 1 rep max calculator, Wilks score, macro calculator, Flint Performance">
  <link rel="canonical" href="https://flintperformance.com/calculator/">

  <!-- Open Graph -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="Fitness Calculators | Flint Performance">
  <meta property="og:description" content="BMI, FFMI, TDEE with macro ratios, 1 rep max, and Wilks score calculators. Enter your stats once — data syncs across all tools.">
  <meta property="og:image" content="https://flintperformance.com/calculator/apple-touch-icon.png">
  <meta property="og:url" content="https://flintperformance.com/calculator/">
  <meta property="og:site_name" content="Flint Performance">

  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="Fitness Calculators | Flint Performance">
  <meta name="twitter:description" content="BMI, FFMI, TDEE, 1RM, and Wilks calculators with synced data and macro breakdowns.">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">

  <!-- Styles & Fonts -->
  <link rel="stylesheet" href="css/styles.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@900&family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">

  <!-- Structured Data -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "WebApplication",
    "name": "Flint Performance Fitness Calculators",
    "description": "Free fitness calculators including BMI, FFMI, TDEE with macro breakdowns, one rep max estimates, and Wilks powerlifting scores.",
    "url": "https://flintperformance.com/calculator/",
    "applicationCategory": "HealthApplication",
    "operatingSystem": "Any",
    "offers": {
      "@type": "Offer",
      "price": "0",
      "priceCurrency": "USD"
    },
    "author": {
      "@type": "Organization",
      "name": "Flint Performance"
    }
  }
  </script>
</head>
<body>
  <a href="#main-content" class="skip-link">Skip to content</a>
  <div id="app">

    <!-- Top Bar -->
    <header class="top-bar" role="banner">
      <span class="top-bar-logo" aria-label="Flint Performance">FLINT<span class="logo-dot" aria-hidden="true">.</span></span>
      <span class="top-bar-title" id="active-calc-title" aria-live="polite">BMI</span>
    </header>

    <!-- Screens -->
    <main class="screens" id="main-content">

      <!-- BMI -->
      <section class="screen active" id="calc-bmi" role="tabpanel" aria-labelledby="tab-bmi">
        <div class="screen-scroll">
          <div class="screen-hero">
            <h1 class="screen-title">BMI</h1>
            <p class="screen-subtitle">Body Mass Index</p>
          </div>
          <form class="screen-form" onsubmit="event.preventDefault(); calculateBMI();" aria-label="BMI Calculator">
            <fieldset class="unit-toggle" role="radiogroup" aria-label="Unit system">
              <button type="button" class="unit-btn active" data-unit="imperial" role="radio" aria-checked="true">Imperial</button>
              <button type="button" class="unit-btn" data-unit="metric" role="radio" aria-checked="false">Metric</button>
            </fieldset>
            <div class="field imperial-fields">
              <label for="bmi-feet">Height</label>
              <div class="field-row">
                <div class="field-input">
                  <input type="number" id="bmi-feet" data-sync="feet" placeholder="5" min="1" max="8" aria-label="Feet">
                  <span class="field-unit" aria-hidden="true">ft</span>
                </div>
                <div class="field-input">
                  <input type="number" id="bmi-inches" data-sync="inches" placeholder="10" min="0" max="11" aria-label="Inches">
                  <span class="field-unit" aria-hidden="true">in</span>
                </div>
              </div>
            </div>
            <div class="field metric-fields" style="display:none;">
              <label for="bmi-cm">Height</label>
              <div class="field-input">
                <input type="number" id="bmi-cm" data-sync="cm" placeholder="178" min="50" max="250" aria-label="Height in centimeters">
                <span class="field-unit" aria-hidden="true">cm</span>
              </div>
            </div>
            <div class="field">
              <label for="bmi-weight">Weight</label>
              <div class="field-input">
                <input type="number" id="bmi-weight" data-sync="weight" placeholder="180" min="1" aria-label="Body weight">
                <span class="field-unit dynamic-weight-unit" aria-hidden="true">lbs</span>
              </div>
            </div>
            <button type="submit" class="action-btn">Calculate</button>
          </form>
          <div class="screen-result" id="bmi-result" role="region" aria-live="polite" aria-label="BMI results"></div>
        </div>
      </section>

      <!-- FFMI -->
      <section class="screen" id="calc-ffmi" role="tabpanel" aria-labelledby="tab-ffmi">
        <div class="screen-scroll">
          <div class="screen-hero">
            <h1 class="screen-title">FFMI</h1>
            <p class="screen-subtitle">Fat-Free Mass Index</p>
          </div>
          <form class="screen-form" onsubmit="event.preventDefault(); calculateFFMI();" aria-label="FFMI Calculator">
            <fieldset class="unit-toggle" role="radiogroup" aria-label="Unit system">
              <button type="button" class="unit-btn active" data-unit="imperial" role="radio" aria-checked="true">Imperial</button>
              <button type="button" class="unit-btn" data-unit="metric" role="radio" aria-checked="false">Metric</button>
            </fieldset>
            <div class="field imperial-fields">
              <label for="ffmi-feet">Height</label>
              <div class="field-row">
                <div class="field-input">
                  <input type="number" id="ffmi-feet" data-sync="feet" placeholder="5" min="1" max="8" aria-label="Feet">
                  <span class="field-unit" aria-hidden="true">ft</span>
                </div>
                <div class="field-input">
                  <input type="number" id="ffmi-inches" data-sync="inches" placeholder="10" min="0" max="11" aria-label="Inches">
                  <span class="field-unit" aria-hidden="true">in</span>
                </div>
              </div>
            </div>
            <div class="field metric-fields" style="display:none;">
              <label for="ffmi-cm">Height</label>
              <div class="field-input">
                <input type="number" id="ffmi-cm" data-sync="cm" placeholder="178" min="50" max="250" aria-label="Height in centimeters">
                <span class="field-unit" aria-hidden="true">cm</span>
              </div>
            </div>
            <div class="field">
              <label for="ffmi-weight">Weight</label>
              <div class="field-input">
                <input type="number" id="ffmi-weight" data-sync="weight" placeholder="180" min="1" aria-label="Body weight">
                <span class="field-unit dynamic-weight-unit" aria-hidden="true">lbs</span>
              </div>
            </div>
            <div class="field">
              <label for="ffmi-bf">Body Fat %</label>
              <div class="field-input">
                <input type="number" id="ffmi-bf" placeholder="15" min="1" max="60" aria-label="Body fat percentage">
                <span class="field-unit" aria-hidden="true">%</span>
              </div>
            </div>
            <button type="submit" class="action-btn">Calculate</button>
          </form>
          <div class="screen-result" id="ffmi-result" role="region" aria-live="polite" aria-label="FFMI results"></div>
        </div>
      </section>

      <!-- TDEE -->
      <section class="screen" id="calc-tdee" role="tabpanel" aria-labelledby="tab-tdee">
        <div class="screen-scroll">
          <div class="screen-hero">
            <h1 class="screen-title">TDEE</h1>
            <p class="screen-subtitle">Total Daily Energy Expenditure</p>
          </div>
          <form class="screen-form" onsubmit="event.preventDefault(); calculateTDEE();" aria-label="TDEE Calculator">
            <fieldset class="unit-toggle" role="radiogroup" aria-label="Unit system">
              <button type="button" class="unit-btn active" data-unit="imperial" role="radio" aria-checked="true">Imperial</button>
              <button type="button" class="unit-btn" data-unit="metric" role="radio" aria-checked="false">Metric</button>
            </fieldset>
            <div class="field-row">
              <div class="field">
                <label for="tdee-sex">Sex</label>
                <select id="tdee-sex" data-sync="sex">
                  <option value="male">Male</option>
                  <option value="female">Female</option>
                </select>
              </div>
              <div class="field">
                <label for="tdee-age">Age</label>
                <div class="field-input">
                  <input type="number" id="tdee-age" data-sync="age" placeholder="25" min="10" max="100">
                  <span class="field-unit" aria-hidden="true">yrs</span>
                </div>
              </div>
            </div>
            <div class="field imperial-fields">
              <label for="tdee-feet">Height</label>
              <div class="field-row">
                <div class="field-input">
                  <input type="number" id="tdee-feet" data-sync="feet" placeholder="5" min="1" max="8" aria-label="Feet">
                  <span class="field-unit" aria-hidden="true">ft</span>
                </div>
                <div class="field-input">
                  <input type="number" id="tdee-inches" data-sync="inches" placeholder="10" min="0" max="11" aria-label="Inches">
                  <span class="field-unit" aria-hidden="true">in</span>
                </div>
              </div>
            </div>
            <div class="field metric-fields" style="display:none;">
              <label for="tdee-cm">Height</label>
              <div class="field-input">
                <input type="number" id="tdee-cm" data-sync="cm" placeholder="178" min="50" max="250" aria-label="Height in centimeters">
                <span class="field-unit" aria-hidden="true">cm</span>
              </div>
            </div>
            <div class="field">
              <label for="tdee-weight">Weight</label>
              <div class="field-input">
                <input type="number" id="tdee-weight" data-sync="weight" placeholder="180" min="1" aria-label="Body weight">
                <span class="field-unit dynamic-weight-unit" aria-hidden="true">lbs</span>
              </div>
            </div>
            <div class="field">
              <label for="tdee-activity">Activity Level</label>
              <select id="tdee-activity">
                <option value="1.2">Sedentary (office job)</option>
                <option value="1.375">Lightly Active (1-3 days/wk)</option>
                <option value="1.55" selected>Moderately Active (3-5 days/wk)</option>
                <option value="1.725">Very Active (6-7 days/wk)</option>
                <option value="1.9">Extremely Active (athlete)</option>
              </select>
            </div>
            <div class="field">
              <label for="tdee-macro-ratio">Macro Ratio</label>
              <select id="tdee-macro-ratio">
                <option value="balanced">Balanced (40/30/30 — C/P/F)</option>
                <option value="high-protein">High Protein (35/40/25 — C/P/F)</option>
                <option value="low-carb">Low Carb (20/40/40 — C/P/F)</option>
                <option value="low-fat">Low Fat (50/30/20 — C/P/F)</option>
                <option value="keto">Keto (5/30/65 — C/P/F)</option>
                <option value="zone">Zone Diet (40/30/30 — C/P/F)</option>
              </select>
            </div>
            <button type="submit" class="action-btn">Calculate</button>
          </form>
          <div class="screen-result" id="tdee-result" role="region" aria-live="polite" aria-label="TDEE results"></div>
        </div>
      </section>

      <!-- 1RM -->
      <section class="screen" id="calc-one-rep-max" role="tabpanel" aria-labelledby="tab-one-rep-max">
        <div class="screen-scroll">
          <div class="screen-hero">
            <h1 class="screen-title">1RM</h1>
            <p class="screen-subtitle">One Rep Max Estimator</p>
          </div>
          <form class="screen-form" onsubmit="event.preventDefault(); calculateOneRepMax();" aria-label="1 Rep Max Calculator">
            <div class="field">
              <label for="orm-weight">Weight Lifted</label>
              <div class="field-input">
                <input type="number" id="orm-weight" placeholder="225" min="1">
                <span class="field-unit" aria-hidden="true">lbs</span>
              </div>
            </div>
            <div class="field">
              <label for="orm-reps">Reps Performed</label>
              <div class="field-input">
                <input type="number" id="orm-reps" placeholder="5" min="1" max="30">
                <span class="field-unit" aria-hidden="true">reps</span>
              </div>
            </div>
            <button type="submit" class="action-btn">Calculate</button>
          </form>
          <div class="screen-result" id="orm-result" role="region" aria-live="polite" aria-label="1 Rep Max results"></div>
        </div>
      </section>

      <!-- Wilks -->
      <section class="screen" id="calc-wilks" role="tabpanel" aria-labelledby="tab-wilks">
        <div class="screen-scroll">
          <div class="screen-hero">
            <h1 class="screen-title">WILKS</h1>
            <p class="screen-subtitle">Strength Coefficient</p>
          </div>
          <form class="screen-form" onsubmit="event.preventDefault(); calculateWilks();" aria-label="Wilks Score Calculator">
            <div class="field">
              <label for="wilks-sex">Sex</label>
              <select id="wilks-sex" data-sync="sex">
                <option value="male">Male</option>
                <option value="female">Female</option>
              </select>
            </div>
            <div class="field">
              <label for="wilks-bw">Body Weight</label>
              <div class="field-input">
                <input type="number" id="wilks-bw" data-sync="weight" placeholder="180" min="1" aria-label="Body weight in pounds">
                <span class="field-unit" aria-hidden="true">lbs</span>
              </div>
            </div>
            <div class="field">
              <label for="wilks-total">Total (S + B + D)</label>
              <div class="field-input">
                <input type="number" id="wilks-total" placeholder="1000" min="1" aria-label="Powerlifting total in pounds">
                <span class="field-unit" aria-hidden="true">lbs</span>
              </div>
            </div>
            <button type="submit" class="action-btn">Calculate</button>
          </form>
          <div class="screen-result" id="wilks-result" role="region" aria-live="polite" aria-label="Wilks results"></div>
        </div>
      </section>

    </main>

    <!-- Bottom Tab Bar -->
    <nav class="tab-bar" role="tablist" aria-label="Calculator navigation">
      <button class="tab active" data-calc="bmi" id="tab-bmi" role="tab" aria-selected="true" aria-controls="calc-bmi">
        <svg class="tab-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M12 2a4 4 0 1 1 0 8 4 4 0 0 1 0-8z"/><path d="M6 22v-4a6 6 0 0 1 12 0v4"/></svg>
        <span>BMI</span>
      </button>
      <button class="tab" data-calc="ffmi" id="tab-ffmi" role="tab" aria-selected="false" aria-controls="calc-ffmi">
        <svg class="tab-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M6.5 6.5L4 4m0 0l2.5 2.5M4 4l2.5-2.5M4 4L1.5 6.5"/><path d="M17.5 6.5L20 4m0 0l-2.5 2.5M20 4l-2.5-2.5M20 4l2.5 2.5"/><rect x="8" y="8" width="8" height="14" rx="1"/><line x1="12" y1="8" x2="12" y2="22"/></svg>
        <span>FFMI</span>
      </button>
      <button class="tab" data-calc="tdee" id="tab-tdee" role="tab" aria-selected="false" aria-controls="calc-tdee">
        <svg class="tab-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2z"/><path d="M12 6v6l4.5 2.5"/></svg>
        <span>TDEE</span>
      </button>
      <button class="tab" data-calc="one-rep-max" id="tab-one-rep-max" role="tab" aria-selected="false" aria-controls="calc-one-rep-max">
        <svg class="tab-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><rect x="1" y="9" width="4" height="6" rx="1"/><rect x="19" y="9" width="4" height="6" rx="1"/><line x1="5" y1="12" x2="19" y2="12"/><rect x="7" y="7" width="3" height="10" rx="0.5"/><rect x="14" y="7" width="3" height="10" rx="0.5"/></svg>
        <span>1RM</span>
      </button>
      <button class="tab" data-calc="wilks" id="tab-wilks" role="tab" aria-selected="false" aria-controls="calc-wilks">
        <svg class="tab-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M8 21l4-12 4 12"/><path d="M6 17h12"/><path d="M12 3v6"/><circle cx="12" cy="3" r="1.5"/></svg>
        <span>Wilks</span>
      </button>
    </nav>

  </div>

  <script src="js/calculators.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
